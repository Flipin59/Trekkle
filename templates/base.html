<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>{% block title %}{% endblock %}</title>
    <style>
        :root {
            --tk-primary: #4aa67b;     /* Alpine Teal / Pine Green */
            --tk-secondary: #D97736;   /* Terracotta / Clay CTA */
            --tk-bg-light: #F8F9FA;    /* Mist Background */
            --tk-bg-dark: #1A202C;     /* Obsidian Text/Dark Elements */
            --tk-accent: #E2ECE9;      /* Sage Green Soft Accent */
        }

        /* Global Body Overrides */
        body {
            background-color: var(--tk-accent);
            color: var(--tk-bg-dark);
        }

        /* Custom Navbar Styling */
        .navbar-trekkle {
            background-color: var(--tk-primary) !important;
        }
        .navbar-trekkle .navbar-brand,
        .navbar-trekkle .nav-link {
            color: #ffffff !important;
            transition: color 0.2s ease-in-out;
        }
        .navbar-trekkle .nav-link:hover,
        .navbar-trekkle .nav-link.active {
            color: var(--tk-accent) !important;
        }

        /* Trekkle Primary & Secondary Button Overrides */
        .btn-trekkle-primary {
            background-color: var(--tk-primary);
            color: #ffffff;
            border: none;
        }
        .btn-trekkle-primary:hover {
            background-color: #15322C;
            color: #ffffff;
        }

        .btn-trekkle-cta {
            background-color: var(--tk-secondary);
            color: #ffffff;
            border: none;
            font-weight: 500;
        }
        .btn-trekkle-cta:hover {
            background-color: #C2632B;
            color: #ffffff;
        }

        /* Utility Helpers */
        .bg-trekkle-accent { background-color: var(--tk-accent) !important; }
        .text-trekkle-primary { color: var(--tk-primary) !important; }
        .text-trekkle-secondary { color: var(--tk-secondary) !important; }


        /* Container rules */
        .scroll-container {
        height: 100vh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
        }

        /* Individual section rules */
        .scroll-container section {
        scroll-snap-align: start;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-trekkle shadow-lg">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="../static/images/LOGO_Trekkle.png" alt="Trekkle Logo" width="30" height="30" class="d-inline-block align-text-top me-2">
            <span class="fw-bold">Trekkle</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="d-flex align-items-center ms-auto gap-2">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#about">Who we are?</a>
                </li>
            {%block navbarContents%}
                <!-- <li class="nav-item">
                    <a class="nav-link" href="#">Guides</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Settings</a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <button class="btn btn-trekkle-cta px-4" type="button">Book a Trek</button>
            </div> -->
            {%endblock%}
        </div>
        </div>
    </div>    
    </nav>
    {%block content%}
    {%endblock%}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
